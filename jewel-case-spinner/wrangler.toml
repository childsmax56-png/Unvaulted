# Cloudflare Worker for the Jewel Case Spinner.
# The files in public/ are packed into the Worker by scripts/bundle.mjs before each
# deploy (see [build]), so there are no bindings and no separate asset upload.
name = "jewel-case-spinner"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[build]
command = "node scripts/bundle.mjs"
